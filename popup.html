<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      height: 140px;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #090714;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content:space-around;
      align-items: center;
      margin: 0;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      font-family: Arial, sans-serif;
      letter-spacing: 2px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #a855f7;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>
<body>
  <div class="title">Start learning for real 🧠.</div>
  <div class="titlscaxe">(ai-block mode)</div>
  <label class="switch">
    <input type="checkbox" id="toggleSwitch">
    <span class="slider"></span>
  </label>
  <script src="scripts/popup.js"></script>
</body>
</html>
